openapi: 3.0.3
info:
  title: CubeFS syncnode — Local Admin API (P2)
  version: "2.0.0"
  description: |
    Post-P2 syncnode HTTP surface. The rule + task admin endpoints
    have moved to master (see docs/plan/master/sync_openapi.yaml).
    This document only covers what stays on the syncnode itself —
    three node-local diagnostic endpoints.

    Console + ops talk to master. Operators only hit syncnode when
    SSH-debugging a single node.

  contact:
    name: CubeFS Sync Team

servers:
  - url: "http://{host}:{port}"
    description: syncnode admin HTTP port (default 17911)
    variables:
      host:
        default: "127.0.0.1"
      port:
        default: "17911"

tags:
  - name: diagnostics
    description: 节点级诊断

security:
  - BearerAuth: []
  - SyncTokenAuth: []

paths:
  /admin/syncnode/version:
    get:
      tags: [diagnostics]
      summary: 版本与构建信息
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/VersionInfo"

  /admin/syncnode/stat:
    get:
      tags: [diagnostics]
      summary: 运行时快照
      description: |
        scheduledRules 在 P2 后恒为 0（master 是 cron 主），保留在响应
        体里只为不破坏控制台 schema。其他字段反映本节点实际运行状态。
      operationId: getStat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/StatSnapshot"

  /admin/syncnode/reload:
    post:
      tags: [diagnostics]
      summary: 触发 sync.json 热加载
      description: |
        Reload re-reads sync.json + applies non-rule fields
        (concurrency, bandwidth limits, etc.). The `rules:[...]` block,
        if present, is now IGNORED — master is the rule authority.
        Log line announces "ignored — master owns rule store" so
        operators see the deprecation.
      operationId: reloadConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "500":
          description: 加载失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <adminToken>`"
    SyncTokenAuth:
      type: apiKey
      in: header
      name: X-Sync-Token

  schemas:
    Response:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 0
        msg:
          type: string
          example: OK
        data:
          nullable: true

    VersionInfo:
      type: object
      properties:
        role:
          type: string
          example: sync
        version:
          type: string
        commit:
          type: string
        buildTime:
          type: string
        nodeAddress:
          type: string

    StatSnapshot:
      type: object
      properties:
        role:
          type: string
        uptimeSeconds:
          type: number
        concurrentTasks:
          type: integer
          format: int64
        reloadFailuresTotal:
          type: integer
          format: int64
        scheduledRules:
          type: integer
          description: "Always 0 post-P2 — master is the cron authority."
        runningTasks:
          type: integer
        boltdbHealthy:
          type: boolean
