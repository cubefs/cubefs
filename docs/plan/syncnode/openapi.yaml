openapi: 3.0.3
info:
  title: CubeFS Syncnode — Complete Admin API
  version: "2.0.0"
  description: |
    Complete HTTP admin surface for the CubeFS sync subsystem.

    **Two servers, two surfaces:**

    | Server | Default Port | Surface |
    |--------|-------------|---------|
    | Master | 17010 | All sync management APIs: node registration, rule CRUD, task observability, direct dispatch |
    | Syncnode | 17911 | Local diagnostics only: version, stat, reload |

    **Authentication:**
    All master sync endpoints require `Authorization: Bearer <syncAdminToken>` (or
    `X-Sync-Token: <token>`). The token is configured as `syncAdminToken` in
    `master.json`. An empty value disables the check (dev/test mode).

    Syncnode local endpoints share the same token scheme but are only
    reachable on the node itself.

    **Response envelope (master + syncnode):**
    ```json
    { "code": 0, "msg": "OK", "data": <payload> }
    ```
    Non-zero `code` signals an error; `data` is null. HTTP status is
    always 200 — check `code` in the body.

    **Common error codes:**
    | code | meaning |
    |------|---------|
    | 0 | success |
    | 7 | ErrCodeParamError — missing or malformed param / body |
    | 10 | ErrCodePersistenceByRaft — raft submit failed; safe to retry |
    | 11 | ErrCodeInternalError — not found, conflict, or other server error |

  contact:
    name: CubeFS Sync Team

servers:
  - url: "http://{host}:{masterPort}"
    description: CubeFS master (default 17010) — all sync management APIs
    variables:
      host:
        default: "127.0.0.1"
      masterPort:
        default: "17010"
  - url: "http://{host}:{syncPort}"
    description: syncnode local admin (default 17911) — diagnostics only
    variables:
      host:
        default: "127.0.0.1"
      syncPort:
        default: "17911"

tags:
  - name: node-registration
    description: Syncnode self-registration (called by syncnode on startup)
  - name: node-mgmt
    description: Node lifecycle — decommission, drain, restore, per-node task listing
  - name: dispatch
    description: Direct task dispatch without a rule
  - name: rule-mgmt
    description: Sync rule CRUD and state transitions
  - name: task-mgmt
    description: Task observability and lifecycle control
  - name: diagnostics
    description: Syncnode-local diagnostics (version, stat, reload)

security:
  - BearerAuth: []
  - SyncTokenAuth: []

# ────────────────────────────────────────────────────────────────────────────
# Master: SyncNode registration + listing
# ────────────────────────────────────────────────────────────────────────────

paths:

  /syncNode/add:
    post:
      tags: [node-registration]
      summary: 注册 syncnode（syncnode 启动时自调用）
      description: |
        Syncnode self-registration. Mirrors `/lcNode/add`. Idempotent on addr —
        calling again for an already-registered addr returns the existing nodeID.
        Master uses the addr for task dispatch and heartbeat tracking.
      operationId: addSyncNode
      parameters:
        - name: addr
          in: query
          required: true
          description: "`host:port` of the registering syncnode"
          schema:
            type: string
            example: "10.89.6.10:17911"
      responses:
        "200":
          description: OK — returns allocated nodeID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: integer
                        format: int64
                        description: Master-allocated numeric node ID
                        example: 42

  /syncNode/list:
    get:
      tags: [node-registration]
      summary: 列出所有已注册的 syncnode
      description: |
        Returns every registered syncnode with its identity and the
        master-computed load score. Lower `loadScore` is better; `+Inf`
        means the node is stale or unhealthy. Ordering is arbitrary —
        sort client-side as needed.

        The load score incorporates four inputs (§6.3.1): capacity
        utilisation (runningTasks / maxConcurrentTasks), bandwidth
        utilisation, failure rate, and staleness penalty.
      operationId: listSyncNodes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SyncNodeInfo"

# ────────────────────────────────────────────────────────────────────────────
# Master: Direct dispatch (no rule)
# ────────────────────────────────────────────────────────────────────────────

  /syncNode/dispatch:
    post:
      tags: [dispatch]
      summary: 直接下发任务（无需规则）
      description: |
        Dispatch a raw sync task without a pre-existing rule. Master picks
        the lowest-load available syncnode (or fans out across N nodes when
        `shardTotal > 1`) and forwards `OpSyncNodeRunTask` via the admin
        TCP channel.

        **Task ID constraints:**
        - Required; must not be empty.
        - Must not end with `/<digits>` — that suffix format is reserved
          for fan-out shard IDs synthesised by master. A caller that passes
          `"job/0"` would be indistinguishable from fan-out shard 0 of
          parent `"job"`, which breaks the terminal handler.
        - May contain other `/` separators freely (e.g. `"job/2026-05-14"`).

        **Single-node response:**
        ```json
        { "code": 0, "data": { "node": "10.89.6.10:17911", "taskID": "job-001" } }
        ```

        **Fan-out response (shardTotal > 1):**
        ```json
        { "code": 0, "data": {
            "taskID": "job-001",
            "shardTotal": 3,
            "owners": { "0": "10.89.6.10:17911", "1": "10.89.6.11:17911", "2": "10.89.6.12:17911" }
        }}
        ```
        Master retries dispatch up to 3 times with next-best candidates on
        nack/failure.
      operationId: dispatchSyncTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRequest"
      responses:
        "200":
          description: Dispatched — check `code` in body
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/Response"
                      - properties:
                          data:
                            $ref: "#/components/schemas/DispatchResponse"
                  - allOf:
                      - $ref: "#/components/schemas/Response"
                      - properties:
                          data:
                            $ref: "#/components/schemas/FanoutDispatchResponse"

# ────────────────────────────────────────────────────────────────────────────
# Master: Node lifecycle
# ────────────────────────────────────────────────────────────────────────────

  /syncNode/decommission:
    post:
      tags: [node-mgmt]
      summary: 下线 syncnode
      description: |
        State transitions:
        - `force=false` (default): mark the node `draining` and return.
          Cluster cron removes it when active task count drops to zero.
          Operator monitors via `GET /syncNode/tasks`.
        - `force=true`: mark draining + immediately cancel/failover every
          active task on the node, then raft-delete the node record.

        Node state machine:
        ```
        Active ──/decommission?force=false──→ Draining ──(tasks=0)──→ Removed
        Active ──/decommission?force=true ──→ Draining ──(failover)──→ Removed
        ```
      operationId: decommissionSyncNode
      parameters:
        - name: addr
          in: query
          required: true
          schema:
            type: string
            example: "10.89.6.10:17911"
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/NodeLifecycleResponse"

  /syncNode/drain:
    post:
      tags: [node-mgmt]
      summary: 排空 syncnode 任务（保留注册）
      description: |
        Cancels and failovers every active task on the node but keeps the
        node registered. Use when preparing for maintenance; follow up with
        `/syncNode/restore` to return the node to active scheduling.

        State machine:
        ```
        Active ──/drain──→ Draining ──/restore──→ Active
        ```
      operationId: drainSyncNode
      parameters:
        - name: addr
          in: query
          required: true
          schema:
            type: string
            example: "10.89.6.10:17911"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/NodeLifecycleResponse"

  /syncNode/restore:
    post:
      tags: [node-mgmt]
      summary: 恢复已排空节点为 active
      description: |
        Flips the node state from `draining` back to `active`. Idempotent
        if the node is already `active`. No effect on running tasks —
        cancellations were dispatched by `/drain`; new tasks will start
        being scheduled to the node again immediately.
      operationId: restoreSyncNode
      parameters:
        - name: addr
          in: query
          required: true
          schema:
            type: string
            example: "10.89.6.10:17911"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: object
                        properties:
                          addr:
                            type: string
                          state:
                            type: string
                            enum: [active, draining]

  /syncNode/tasks:
    get:
      tags: [node-mgmt]
      summary: 查询指定节点上的任务列表
      description: |
        Returns the task ledger entries whose `owner` matches the given addr.
        Useful for monitoring drain progress — poll until the list is empty.
      operationId: listSyncNodeTasks
      parameters:
        - name: addr
          in: query
          required: true
          schema:
            type: string
            example: "10.89.6.10:17911"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SyncTaskStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SyncTaskRecord"

# ────────────────────────────────────────────────────────────────────────────
# Master: SyncRule CRUD + state transitions
# ────────────────────────────────────────────────────────────────────────────

  /syncRule/create:
    post:
      tags: [rule-mgmt]
      summary: 创建同步规则
      description: |
        Body is a **flat `SyncRuleConfig` JSON object** — not the outer
        `SyncRule` wrapper. Server controls `state`, `createdAt`,
        `updatedAt`, and `lastRun*` fields.

        Validation rules (400 on violation):
        - `id` required; must not contain `/`.
        - `type` required.
        - `shardingStrategy` must be one of: `""`, `"hash"`, `"prefix"`,
          `"auto"`.
        - When `shardingStrategy == "prefix"`, `shardPrefixes` must be
          non-empty.

        Newly created rules are always `active`. To start paused, create
        then call `/syncRule/pause`.
      operationId: createSyncRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRuleConfig"
            example:
              id: "backup-cfs-to-s3"
              type: "sync"
              schedule: "0 2 * * *"
              src:
                kind: "cfs"
                vol: "myvol"
                path: "/data"
              dst:
                kind: "s3"
                endpoint: "https://s3.ap-east-1.amazonaws.com"
                region: "ap-east-1"
                bucket: "my-backup"
                prefix: "daily/"
              parallelism: 4
              bandwidthLimitMBps: 200
      responses:
        "200":
          description: Created — returns full SyncRule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SyncRule"

  /syncRule/update:
    post:
      tags: [rule-mgmt]
      summary: 更新同步规则配置
      description: |
        Body is the same flat `SyncRuleConfig` shape as create. The rule
        must already exist (identified by `id`). Server merges caller's
        `config` over the existing record and refreshes `updatedAt`.
        Server-owned fields (`state`, `createdAt`, `lastRun*`) are
        preserved.
      operationId: updateSyncRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRuleConfig"
      responses:
        "200":
          description: Updated — returns full SyncRule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SyncRule"

  /syncRule/delete:
    post:
      tags: [rule-mgmt]
      summary: 删除同步规则
      description: |
        Raft-deletes the rule record and removes it from the cron
        scheduler. In-flight tasks are NOT cancelled automatically —
        cancel them first via `/syncTask/cancel` if needed.
      operationId: deleteSyncRule
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          example: "backup-cfs-to-s3"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string

  /syncRule/pause:
    post:
      tags: [rule-mgmt]
      summary: 暂停规则（停止调度触发）
      description: |
        Transitions the rule to `paused`. Cron scheduler stops firing this
        rule until resumed. In-flight tasks are unaffected — they continue
        to run.

        Idempotent: calling on an already-paused rule returns success.
      operationId: pauseSyncRule
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paused — returns updated SyncRule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SyncRule"

  /syncRule/resume:
    post:
      tags: [rule-mgmt]
      summary: 恢复规则调度
      description: |
        Transitions the rule from `paused` or `degraded` back to `active`.
        Cron scheduler resumes firing the rule on its next tick.

        Idempotent: calling on an already-active rule returns success.
      operationId: resumeSyncRule
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resumed — returns updated SyncRule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SyncRule"

  /syncRule/list:
    get:
      tags: [rule-mgmt]
      summary: 列出同步规则
      description: |
        Returns all cached rules. Optional `state` filter. Output is
        unordered — sort client-side as needed.
      operationId: listSyncRules
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SyncRuleState"
          description: When omitted, all rules regardless of state are returned
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SyncRule"

  /syncRule/get:
    get:
      tags: [rule-mgmt]
      summary: 获取单条规则
      operationId: getSyncRule
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SyncRule"

  /syncRule/trigger:
    post:
      tags: [rule-mgmt]
      summary: 立即触发规则执行（跳过 cron 等待）
      description: |
        Fires the rule's dispatch path immediately — same code path as the
        cron callback. Generates a fresh taskID (`<ruleID>/<nanoseconds>`).
        Useful for ops scripts and integration tests that don't want to
        wait for the next scheduled tick.

        Rule must be in `active` state — paused or degraded rules are
        rejected (400).

        Concurrent calls produce distinct taskIDs; the dispatcher's ledger
        de-duplicates against in-flight tasks so concurrent triggers don't
        collide.
      operationId: triggerSyncRule
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          example: "backup-cfs-to-s3"
      responses:
        "200":
          description: Dispatched — returns ruleID + new taskID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: object
                        properties:
                          ruleID:
                            type: string
                          taskID:
                            type: string
                            example: "backup-cfs-to-s3/1715798400000000000"

# ────────────────────────────────────────────────────────────────────────────
# Master: SyncTask observability + lifecycle
# ────────────────────────────────────────────────────────────────────────────

  /syncTask/list:
    get:
      tags: [task-mgmt]
      summary: 列出任务（支持多维过滤）
      description: |
        Returns records from the in-memory LRU ledger. All filters are
        optional and conjunctive. Ordering reflects LRU recency (most
        recent first).

        Fan-out parent tasks have `owner=""` and `shardTotal > 0`; their
        children (shards) have `owner=<addr>` and matching `shardIdx`.
      operationId: listSyncTasks
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SyncTaskStatus"
        - name: ruleID
          in: query
          required: false
          schema:
            type: string
          description: Filter by originating rule ID
        - name: owner
          in: query
          required: false
          schema:
            type: string
          description: Filter by owning syncnode addr
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SyncTaskRecord"

  /syncTask/get:
    get:
      tags: [task-mgmt]
      summary: 获取单个任务详情
      operationId: getSyncTask
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          example: "backup-cfs-to-s3/1715798400000000000"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SyncTaskRecord"

  /syncTask/cancel:
    post:
      tags: [task-mgmt]
      summary: 取消任务（异步）
      description: |
        Queues an `OpSyncNodeCancelTask` packet to the owning syncnode.
        The actual status flip is **asynchronous** — the executor reacts
        to `ctx.Done()`. Poll `/syncTask/get` for the terminal status.

        **Fan-out parent task:** cancels every non-terminal shard by addr.
        Response includes `cancelled` count.

        **Already-terminal task:** idempotent success, returns current status.

        Cancel flow:
        ```
        POST /syncTask/cancel → 200 { status: "cancelling" }
        ...poll /syncTask/get...
        200 { status: "cancelled" }   ← terminal
        ```
      operationId: cancelSyncTask
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancel dispatched or already terminal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: object
                        properties:
                          taskID:
                            type: string
                          status:
                            type: string
                            example: "cancelling"
                          cancelled:
                            type: integer
                            description: Number of shard cancel packets sent (fan-out only)

  /syncTask/retry:
    post:
      tags: [task-mgmt]
      summary: 重试任务（以原规则重新下发）
      description: |
        Re-dispatches the task's originating rule via SyncRuleManager,
        generating a **fresh taskID**. The original task record is
        preserved in the ledger.

        Rule must still exist in the cache — if the rule was deleted, the
        retry fails with an error. In that case, use `/syncNode/dispatch`
        for a raw re-dispatch.

        Response includes both the original taskID and the new taskID.
      operationId: retrySyncTask
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: TaskID of the task to retry
      responses:
        "200":
          description: Retried — returns prev and new taskIDs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        type: object
                        properties:
                          prevTaskID:
                            type: string
                          newTaskID:
                            type: string
                          record:
                            $ref: "#/components/schemas/SyncTaskRecord"

  /syncTask/export:
    get:
      tags: [task-mgmt]
      summary: 导出任务历史（NDJSON 流）
      description: |
        Streams the full task ledger as newline-delimited JSON
        (`application/x-ndjson`). Each line is a JSON-serialised
        `SyncTaskRecord`.

        Unlike other endpoints this bypasses the standard response
        envelope — the body is a stream of records. The response is
        served with `Content-Disposition: attachment; filename="sync-task-history.jsonl"`.

        Optional `since` filter: only records whose `startedAt ≥ since`
        are emitted.
      operationId: exportSyncTasks
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: RFC3339 timestamp — emit only tasks started at or after this time
          example: "2026-05-14T00:00:00Z"
      responses:
        "200":
          description: NDJSON stream
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One JSON SyncTaskRecord per line

# ────────────────────────────────────────────────────────────────────────────
# Master: Internal endpoint (syncnode → master push)
# ────────────────────────────────────────────────────────────────────────────

  /syncNode/response:
    post:
      tags: [node-registration]
      summary: "[内部] Syncnode 心跳 + 任务终态上报"
      description: |
        **Not for operator use.** Called by syncnode's heartbeat goroutine
        to push live metrics and task terminal reports to master.

        Master drives these state updates on receipt:
        - Heartbeat: updates `SyncNode.RunningTasks`, `BoltDBHealthy`, and
          other load-score inputs.
        - Task terminal: calls `SyncDispatcher.Release` + `SyncFailover.Forget`,
          updates the task ledger record to the terminal status.

        The response body carries master-computed bandwidth quotas
        (rule-level + backend-level) that syncnode applies immediately via
        its ratelimit registry. This inline quota delivery replaces the
        old `GET /syncNode/getQuota` poll (deprecated, removed).

        Response schema: `SyncNodeQuotaReply`.
      operationId: handleSyncNodeTaskResponse
      requestBody:
        required: true
        description: AdminTask envelope (serialised as JSON; same shape used for other node response endpoints)
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK — quota assignments for this node
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SyncNodeQuotaReply"

# ────────────────────────────────────────────────────────────────────────────
# Syncnode local: diagnostics (port 17911)
# ────────────────────────────────────────────────────────────────────────────

  /admin/syncnode/version:
    get:
      tags: [diagnostics]
      summary: 版本与构建信息
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/VersionInfo"

  /admin/syncnode/stat:
    get:
      tags: [diagnostics]
      summary: 运行时快照（本节点）
      description: |
        Point-in-time snapshot of this syncnode's runtime state.
        `scheduledRules` is always 0 post-P2 (master is the cron
        authority) — the field is retained in the schema to avoid
        breaking console parsers.
      operationId: getStat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - properties:
                      data:
                        $ref: "#/components/schemas/StatSnapshot"

  /admin/syncnode/reload:
    post:
      tags: [diagnostics]
      summary: 热加载 sync.json（不含规则）
      description: |
        Re-reads `sync.json` and applies non-rule fields such as
        concurrency limits and bandwidth ceilings. The `rules:[...]` block
        in `sync.json`, if present, is **silently ignored** — master is
        the authoritative rule store since P2. A log line announces
        "ignored — master owns rule store" for operator visibility.

        Safe to call at any time. Running tasks are unaffected.
      operationId: reloadConfig
      responses:
        "200":
          description: Reload succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "500":
          description: Reload failed (parse error or I/O error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

# ────────────────────────────────────────────────────────────────────────────
# Components
# ────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <syncAdminToken>`"
    SyncTokenAuth:
      type: apiKey
      in: header
      name: X-Sync-Token
      description: Alternative to Bearer; same token value from `syncAdminToken` in master.json

  schemas:

    # ── Common response envelope ───────────────────────────────────────────

    Response:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 0
          description: "0 = success. Non-zero = error (check msg). HTTP status is always 200."
        msg:
          type: string
          example: "OK"
        data:
          nullable: true
          description: Payload on success; null on error.

    # ── SyncRule ───────────────────────────────────────────────────────────

    SyncRuleState:
      type: string
      enum: [active, paused, degraded]
      description: |
        - `active`: rule fires on schedule
        - `paused`: schedule suspended by operator
        - `degraded`: auto-paused by master after repeated task failures

    SyncEndpointConfig:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [cfs, s3, local]
          description: Backend type. Determines which other fields are used.
        # cfs fields
        vol:
          type: string
          description: CubeFS volume name (cfs only)
        path:
          type: string
          description: Path within the volume / local filesystem
        # s3 fields
        bucket:
          type: string
        prefix:
          type: string
        endpoint:
          type: string
          example: "https://s3.ap-east-1.amazonaws.com"
        region:
          type: string
        storageClass:
          type: string
        accessKeyEnv:
          type: string
          description: Name of env var holding the S3 access key (overrides global s3Defaults)
        secretKeyEnv:
          type: string
          description: Name of env var holding the S3 secret key
        insecureSkipTLS:
          type: boolean
          default: false
          description: Disable TLS certificate verification (dev/test only)
        usePathStyle:
          type: boolean
          default: false
          description: Force S3 path-style addressing (required for Ceph RGW, ByteDance TOS, etc.)
        # local fields
        bufferSizeKiB:
          type: integer
        concurrency:
          type: integer
        directIO:
          type: boolean
        fadviseSequential:
          type: boolean

    SyncFilterConfig:
      type: object
      properties:
        include:
          type: array
          items:
            type: string
          description: Glob patterns — only matching files are synced
        exclude:
          type: array
          items:
            type: string
          description: Glob patterns — matching files are skipped
        minSize:
          type: string
          description: "Human-readable size threshold, e.g. \"1MB\""
        maxSize:
          type: string
          description: "Human-readable size threshold, e.g. \"10GB\""
        minAge:
          type: string
          description: "Duration string, e.g. \"30s\", \"1h\""
        maxAge:
          type: string

    SyncRetentionConfig:
      type: object
      properties:
        pattern:
          type: string
          description: Glob pattern selecting destination files subject to retention
        keepLast:
          type: integer
          description: Keep the N most recent matching objects
        keepWithin:
          type: string
          description: "Keep objects created within this duration, e.g. \"7d\""

    SyncRuleConfig:
      type: object
      required: [id, type]
      description: |
        Wire body for `/syncRule/create` and `/syncRule/update`.
        Server-owned fields (`state`, `createdAt`, `updatedAt`, `lastRun*`)
        are NOT accepted in the body and are always overwritten server-side.
      properties:
        id:
          type: string
          description: Stable unique identifier. Must not contain `/`.
          example: "backup-cfs-to-s3"
        type:
          type: string
          description: Task type understood by the syncnode executor (e.g. `"sync"`)
          example: "sync"
        schedule:
          type: string
          description: Cron expression (5-field, UTC). Leave empty for manual-only rules.
          example: "0 2 * * *"
        src:
          $ref: "#/components/schemas/SyncEndpointConfig"
        dst:
          $ref: "#/components/schemas/SyncEndpointConfig"
        filter:
          $ref: "#/components/schemas/SyncFilterConfig"
        retention:
          $ref: "#/components/schemas/SyncRetentionConfig"
        afterCopy:
          type: string
          enum: ["", "delete-src", "archive-src"]
          description: Action on source file after successful copy
        downloadStrategy:
          type: string
          description: Strategy hint for the executor (backend-specific)
        onMismatch:
          type: string
          enum: ["", "overwrite", "skip", "fail"]
          description: Behaviour when src and dst checksums differ
        sampleStrategy:
          type: string
          description: Verification sampling strategy
        sampleRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fraction of files to verify (0.0–1.0)
        bandwidthLimitMBps:
          type: integer
          description: Per-node egress bandwidth ceiling in MB/s (0 = unlimited)
        aggregateBandwidthLimitMBps:
          type: integer
          description: Cluster-wide egress ceiling for this rule in MB/s (0 = unlimited)
        parallelism:
          type: integer
          description: Number of concurrent file transfer workers per task execution
        shardingStrategy:
          type: string
          enum: ["", "hash", "prefix", "auto"]
          description: |
            Fan-out strategy when master dispatches this rule across multiple syncnodes:
            - `""` / `"hash"`: FNV-1a hash on object key (default; even distribution)
            - `"prefix"`: use `shardPrefixes` literally; len(shardPrefixes) defines shard count
            - `"auto"`: master probes backend top-level prefixes at fire time
        shardPrefixes:
          type: array
          items:
            type: string
          description: Explicit partition prefixes for `shardingStrategy=prefix`

    SyncRule:
      type: object
      description: Full runtime view of a sync rule as stored and returned by master.
      properties:
        config:
          $ref: "#/components/schemas/SyncRuleConfig"
        state:
          $ref: "#/components/schemas/SyncRuleState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
          description: Zero / omitted until the first task completes
        lastRunStatus:
          type: string
          enum: ["", "done", "failed", "cancelled"]
        lastRunError:
          type: string
          description: Non-empty only when `lastRunStatus == "failed"`

    # ── SyncNode ───────────────────────────────────────────────────────────

    SyncNodeInfo:
      type: object
      description: Identity + load score for a registered syncnode.
      properties:
        nodeId:
          type: integer
          format: int64
        addr:
          type: string
          example: "10.89.6.10:17911"
        version:
          type: string
        commit:
          type: string
        capabilities:
          type: array
          items:
            type: string
          description: "e.g. [\"s3\", \"cfs\", \"local\"]"
        registeredAt:
          type: integer
          format: int64
          description: Unix epoch seconds when the node last registered
        state:
          type: string
          enum: [active, draining]
        loadScore:
          type: number
          format: double
          description: Master-computed scheduler score. Lower is better; +Inf = stale/unhealthy.

    NodeLifecycleResponse:
      type: object
      properties:
        addr:
          type: string
        state:
          type: string
          enum: [active, draining]
        force:
          type: boolean
          description: Present on decommission responses only
        drained:
          type: integer
          description: Number of task cancel packets sent
        removed:
          type: boolean
          description: true when force=true and the node record was raft-deleted

    # ── SyncTask ───────────────────────────────────────────────────────────

    SyncTaskStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
      description: |
        - `queued`: dispatched, not yet started on syncnode
        - `running`: actively executing on owning syncnode
        - `succeeded`: completed without error
        - `failed`: completed with error (see `error` field)
        - `cancelled`: cancelled by operator or fan-out parent

    SyncTaskProgress:
      type: object
      properties:
        filesTotal:
          type: integer
          format: int64
        filesDone:
          type: integer
          format: int64
        filesSkipped:
          type: integer
          format: int64
        filesFailed:
          type: integer
          format: int64
        bytesTotal:
          type: integer
          format: int64
        bytesDone:
          type: integer
          format: int64
        throughputMBps:
          type: number
          format: double

    SyncTaskRecord:
      type: object
      description: |
        Task ledger entry. Fan-out parent tasks have `owner=""` and
        `shardTotal > 0`. Their shard children carry `owner=<addr>` and
        `shardIdx`. `taskID` of shards is `<parentID>/<shardIdx>`.
      properties:
        taskID:
          type: string
          example: "backup-cfs-to-s3/1715798400000000000"
        ruleID:
          type: string
          description: ID of the originating rule; empty for tasks created via /syncNode/dispatch
        type:
          type: string
        status:
          $ref: "#/components/schemas/SyncTaskStatus"
        owner:
          type: string
          description: Syncnode addr owning this task; empty for fan-out parent tasks
          example: "10.89.6.10:17911"
        shardIdx:
          type: integer
          description: Zero-based shard index (fan-out children only)
        shardTotal:
          type: integer
          description: Total shard count (fan-out parent/children only)
        startedAt:
          type: string
          format: date-time
        doneAt:
          type: string
          format: date-time
          description: Zero / omitted until terminal
        error:
          type: string
          description: Non-empty only on status=failed
        progress:
          $ref: "#/components/schemas/SyncTaskProgress"

    # ── Dispatch ───────────────────────────────────────────────────────────

    DispatchRequest:
      type: object
      required: [ID, Request]
      description: |
        Request body for `POST /syncNode/dispatch`.
        `ID` is the caller-supplied task ID. `Request` is the opaque
        payload forwarded to the syncnode executor unchanged.
        Set `shardTotal > 1` to fan out across multiple syncnodes.
      properties:
        ID:
          type: string
          description: |
            Caller-supplied task ID. Required. Must not end with `/<digits>`
            (that suffix is reserved for fan-out shard IDs synthesised by master).
          example: "my-one-off-job/2026-05-14"
        Request:
          type: object
          description: |
            Opaque task payload forwarded verbatim to the syncnode executor.
            Typically includes `ruleId`, source/destination config, and
            any other executor-specific fields.
        shardTotal:
          type: integer
          description: |
            When > 1, master fans the task out to `shardTotal` distinct
            syncnodes via SyncFanout.DispatchN. Omit or set to 1 for
            single-node dispatch.
          example: 3

    DispatchResponse:
      type: object
      description: Response for single-node dispatch
      properties:
        node:
          type: string
          description: Addr of the syncnode the task was dispatched to
          example: "10.89.6.10:17911"
        taskID:
          type: string

    FanoutDispatchResponse:
      type: object
      description: Response for fan-out dispatch (shardTotal > 1)
      properties:
        taskID:
          type: string
          description: Parent task ID (caller-supplied)
        shardTotal:
          type: integer
        owners:
          type: object
          additionalProperties:
            type: string
          description: |
            Map from shard index (as string) to owning syncnode addr.
            e.g. `{"0": "10.89.6.10:17911", "1": "10.89.6.11:17911"}`

    # ── Syncnode → Master push ─────────────────────────────────────────────

    SyncNodeQuotaReply:
      type: object
      description: Returned by `/syncNode/response` — quota assignments for the reporting node.
      properties:
        nodeId:
          type: integer
          format: int64
        addr:
          type: string
        ruleQuotas:
          type: object
          additionalProperties:
            type: number
          description: "Per-rule egress ceiling in MB/s. Key = rule ID. 0 = no cluster quota."
        backendQuotas:
          type: object
          additionalProperties:
            type: number
          description: |
            Per-backend egress ceiling in MB/s.
            Key format: `"<kind>|<endpoint>|<region>"`.

    # ── Syncnode local ─────────────────────────────────────────────────────

    VersionInfo:
      type: object
      properties:
        role:
          type: string
          example: "sync"
        version:
          type: string
          example: "v3.4.0"
        commit:
          type: string
        buildTime:
          type: string
        nodeAddress:
          type: string

    StatSnapshot:
      type: object
      description: Point-in-time runtime metrics for this syncnode.
      properties:
        role:
          type: string
          example: "sync"
        uptimeSeconds:
          type: number
        concurrentTasks:
          type: integer
          format: int64
          description: Configured concurrency ceiling
        reloadFailuresTotal:
          type: integer
          format: int64
          description: Cumulative reload failure count since process start
        scheduledRules:
          type: integer
          description: |
            Always 0 post-P2 — master is the cron authority.
            Retained for console schema compatibility.
        runningTasks:
          type: integer
          description: Active in-flight task count on this node
        boltdbHealthy:
          type: boolean
          description: Whether the local BoltDB state store is responsive
